---

docker_project_name: "{{ semaphore_project_name }}"

semaphore_env:

  - { option: 'SEMAPHORE_VERSION', var: "semaphore_version" }

  - { option: 'USER_ID',  var: "semaphore_puid" }
  - { option: 'GROUP_ID', var: "semaphore_pgid" }
  - { option: 'TZ',       var: "semaphore_timezone" }

  - { option: 'SEMAPHORE_ADMIN_NAME',     var: "semaphore_admin_name" }
  - { option: 'SEMAPHORE_ADMIN_EMAIL',    var: "semaphore_admin_email" }
  - { option: 'SEMAPHORE_ADMIN',          var: "semaphore_admin" }
  - { option: 'SEMAPHORE_ADMIN_PASSWORD', var: "semaphore_admin_password" }

  ## Database
  - { option: 'SEMAPHORE_DB_DIALECT', var: "semaphore_db_dialect" }
  - { option: 'SEMAPHORE_DB_HOST',    var: "semaphore_db_host" }
  - { option: 'SEMAPHORE_DB_PORT',    var: "semaphore_db_port" }
  - { option: 'SEMAPHORE_DB_NAME',    var: "semaphore_db_name" }
  - { option: 'SEMAPHORE_DB_USER',    var: "semaphore_db_user" }
  - { option: 'SEMAPHORE_DB_PASS',    var: "semaphore_db_pass" }
  - { option: 'SEMAPHORE_DB_OPTIONS', var: "semaphore_db_options_json" }

  ## Ansible environment variables
  - { option: 'ANSIBLE_HOST_KEY_CHECKING',    var: "semaphore_ansible_host_key_checking" }

  ## Security
  - { option: 'SEMAPHORE_ACCESS_KEY_ENCRYPTION', var: "semaphore_access_key_encryption" }
  - { option: 'SEMAPHORE_OPTION_ENCRYPTION',     var: "semaphore_option_encryption" }
  - { option: 'SEMAPHORE_COOKIE_HASH',           var: "semaphore_cookie_hash" }
  - { option: 'SEMAPHORE_COOKIE_ENCRYPTION',     var: "semaphore_cookie_encryption" }

  - { option: 'SEMAPHORE_SCHEDULE_TIMEZONE', var: "semaphore_schedule_timezone" }

  - { option: 'SEMAPHORE_ENV_VARS',           var: "semaphore_env_vars_json" }
  - { option: 'SEMAPHORE_FORWARDED_ENV_VARS', var: "semaphore_forwarded_env_vars_json" }


  ## Additional Semaphore configuration variables
  # https://semaphoreui.com/docs/admin-guide/configuration

  - { option: 'SEMAPHORE_GIT_CLIENT', var: "semaphore_git_client" }
  - { option: 'SEMAPHORE_SSH_PATH',   var: "semaphore_ssh_path" }
  - { option: 'SEMAPHORE_PORT',       var: "semaphore_port" }
  - { option: 'SEMAPHORE_INTERFACE',  var: "semaphore_interface" }

  - { option: 'SEMAPHORE_TMP_PATH',               var: "semaphore_tmp_path" }
  - { option: 'SEMAPHORE_SECRETS_PATH',           var: "semaphore_secrets_path" }
  - { option: 'SEMAPHORE_REPOS_DIR',              var: "semaphore_repos_dir" }
  - { option: 'SEMAPHORE_SSH_AGENT_SOCKETS_DIR',  var: "semaphore_ssh_agent_sockets_dir" }
  - { option: 'SEMAPHORE_HOME_DIR_MODE',          var: "semaphore_home_dir_mode" }

  - { option: 'SEMAPHORE_MAX_PARALLEL_TASKS',     var: "semaphore_max_parallel_tasks" }
  - { option: 'SEMAPHORE_MAX_TASK_DURATION_SEC',  var: "semaphore_max_task_duration_sec" }
  - { option: 'SEMAPHORE_MAX_TASKS_PER_TEMPLATE', var: "semaphore_max_tasks_per_template" }

  - { option: 'SEMAPHORE_OIDC_PROVIDERS',               var: "semaphore_oidc_providers" }
  - { option: 'SEMAPHORE_PASSWORD_LOGIN_DISABLED',      var: "semaphore_password_login_disabled" }
  - { option: 'SEMAPHORE_NON_ADMIN_CAN_CREATE_PROJECT', var: "semaphore_non_admin_can_create_project" }

  - { option: 'SEMAPHORE_APPS',               var: "semaphore_apps_json" }

  - { option: 'SEMAPHORE_USE_REMOTE_RUNNER',         var: "semaphore_use_remote_runner" }
  - { option: 'SEMAPHORE_RUNNER_REGISTRATION_TOKEN', var: "semaphore_runner_registration_token" }

  ## JWT
  - { option: 'SEMAPHORE_JWT_ENABLED',     var: "semaphore_jwt_enabled" }
  - { option: 'SEMAPHORE_JWT_ISSUER',      var: "semaphore_jwt_issuer" }
  - { option: 'SEMAPHORE_JWT_DEFAULT_TTL', var: "semaphore_jwt_default_ttl" }
  - { option: 'SEMAPHORE_JWT_MAX_TTL',     var: "semaphore_jwt_max_ttl" }

  ## Runner
  # ...

  ## Runners (server-side fleet)
  # ...

  ## Teams
  - { option: 'SEMAPHORE_TEAMS_INVITES_ENABLED',   var: "semaphore_teams_invites_enabled" }
  - { option: 'SEMAPHORE_TEAMS_INVITE_TYPE',       var: "semaphore_teams_invite_type" }
  - { option: 'SEMAPHORE_TEAMS_MEMBERS_CAN_LEAVE', var: "semaphore_teams_members_can_leave" }

  ## Security
  - { option: 'SEMAPHORE_WEB_ROOT', var: "semaphore_web_root" }

  - { option: 'SEMAPHORE_TLS_ENABLED',            var: "semaphore_tls_enabled" }
  - { option: 'SEMAPHORE_TLS_CERT_FILE',          var: "semaphore_tls_cert_file" }
  - { option: 'SEMAPHORE_TLS_KEY_FILE',           var: "semaphore_tls_key_file" }
  - { option: 'SEMAPHORE_TLS_HTTP_REDIRECT_ADDR', var: "semaphore_tls_http_redirect_addr" }
  - { option: 'SEMAPHORE_TLS_HTTP_REDIRECT_PORT', var: "semaphore_tls_http_redirect_port" }

  - { option: 'SEMAPHORE_TOTP_ENABLED',        var: "semaphore_totp_enabled" }
  - { option: 'SEMAPHORE_TOTP_ISSUER',         var: "semaphore_totp_issuer" }
  - { option: 'SEMAPHORE_TOTP_ALLOW_RECOVERY', var: "semaphore_totp_allow_recovery" }

  - { option: 'SEMAPHORE_EMAIL_2TP_ENABLED',                      var: "semaphore_email_2tp_enabled" }
  - { option: 'SEMAPHORE_EMAIL_2TP_ALLOW_LOGIN_AS_EXTERNAL_USER', var: "semaphore_email_2tp_allow_login_as_external_user" }
  - { option: 'SEMAPHORE_EMAIL_2TP_ALLOW_CREATE_EXTERNAL_USER',   var: "semaphore_email_2tp_allow_create_external_user" }
  - { option: 'SEMAPHORE_EMAIL_2TP_ALLOWED_DOMAINS',              var: "semaphore_email_2tp_allowed_domains_json" }
  - { option: 'SEMAPHORE_EMAIL_2TP_DISABLE_FOR_OIDC',             var: "semaphore_email_2tp_disable_for_oidc" }

  ## Metrics
  - { option: 'SEMAPHORE_METRICS_ENABLED',  var: "semaphore_metrics_enabled" }
  - { option: 'SEMAPHORE_METRICS_USERNAME', var: "semaphore_metrics_username" }
  - { option: 'SEMAPHORE_METRICS_PASSWORD', var: "semaphore_metrics_password" }

  ## Encryption
  - { option: 'SEMAPHORE_ENCRYPTION_KEYS_FILE',          var: "semaphore_encryption_keys_file" }
  - { option: 'SEMAPHORE_ENCRYPTION_KEYS_POLL_INTERVAL', var: "semaphore_encryption_keys_poll_interval" }

  ## Process
  - { option: 'SEMAPHORE_PROCESS_USER',         var: "semaphore_process_user" }
  - { option: 'SEMAPHORE_PROCESS_UID',          var: "semaphore_process_uid" }
  - { option: 'SEMAPHORE_PROCESS_GID',          var: "semaphore_process_gid" }
  - { option: 'SEMAPHORE_PROCESS_CHROOT',       var: "semaphore_process_chroot" }
  - { option: 'SEMAPHORE_PROCESS_NO_NEW_PRIVS', var: "semaphore_process_no_new_privs" }
  - { option: 'SEMAPHORE_PROCESS_APP_NS_USER',  var: "semaphore_process_app_ns_user" }
  - { option: 'SEMAPHORE_PROCESS_APP_NS_MOUNT', var: "semaphore_process_app_ns_mount" }
  - { option: 'SEMAPHORE_PROCESS_APP_NS_PID',   var: "semaphore_process_app_ns_pid" }
  - { option: 'SEMAPHORE_PROCESS_APP_NS_IPC',   var: "semaphore_process_app_ns_ipc" }
  - { option: 'SEMAPHORE_PROCESS_APP_NS_UTS',   var: "semaphore_process_app_ns_uts" }

  ## Email
  - { option: 'SEMAPHORE_EMAIL_SENDER',          var: "semaphore_email_sender" }
  - { option: 'SEMAPHORE_EMAIL_HOST',            var: "semaphore_email_host" }
  - { option: 'SEMAPHORE_EMAIL_PORT',            var: "semaphore_email_port" }
  - { option: 'SEMAPHORE_EMAIL_SECURE',          var: "semaphore_email_secure" }
  - { option: 'SEMAPHORE_EMAIL_TLS',             var: "semaphore_email_tls" }
  - { option: 'SEMAPHORE_EMAIL_TLS_MIN_VERSION', var: "semaphore_email_tls_min_version" }
  - { option: 'SEMAPHORE_EMAIL_USERNAME',        var: "semaphore_email_username" }
  - { option: 'SEMAPHORE_EMAIL_PASSWORD',        var: "semaphore_email_password" }
  - { option: 'SEMAPHORE_EMAIL_ALERT',           var: "semaphore_email_alert" }

  ## Messengers
  - { option: 'SEMAPHORE_TELEGRAM_ALERT',        var: "semaphore_telegram_alert" }
  - { option: 'SEMAPHORE_TELEGRAM_CHAT',         var: "semaphore_telegram_chat" }
  - { option: 'SEMAPHORE_TELEGRAM_TOKEN',        var: "semaphore_telegram_token" }
  - { option: 'SEMAPHORE_SLACK_ALERT',           var: "semaphore_slack_alert" }
  - { option: 'SEMAPHORE_SLACK_URL',             var: "semaphore_slack_url" }
  - { option: 'SEMAPHORE_MICROSOFT_TEAMS_ALERT', var: "semaphore_microsoft_teams_alert" }
  - { option: 'SEMAPHORE_MICROSOFT_TEAMS_URL',   var: "semaphore_microsoft_teams_url" }
  - { option: 'SEMAPHORE_ROCKETCHAT_ALERT',      var: "semaphore_rocketchat_alert" }
  - { option: 'SEMAPHORE_ROCKETCHAT_URL',        var: "semaphore_rocketchat_url" }
  - { option: 'SEMAPHORE_DINGTALK_ALERT',        var: "semaphore_dingtalk_alert" }
  - { option: 'SEMAPHORE_DINGTALK_URL',          var: "semaphore_dingtalk_url" }
  - { option: 'SEMAPHORE_GOTIFY_ALERT',          var: "semaphore_gotify_alert" }
  - { option: 'SEMAPHORE_GOTIFY_URL',            var: "semaphore_gotify_url" }
  - { option: 'SEMAPHORE_GOTIFY_TOKEN',          var: "semaphore_gotify_token" }

  ## LDAP
  - { option: 'SEMAPHORE_LDAP_ENABLE',        var: "semaphore_ldap_enable" }
  - { option: 'SEMAPHORE_LDAP_NEEDTLS',       var: "semaphore_ldap_needtls" }
  - { option: 'SEMAPHORE_LDAP_BIND_DN',       var: "semaphore_ldap_bind_dn" }
  - { option: 'SEMAPHORE_LDAP_BIND_PASSWORD', var: "semaphore_ldap_bind_password" }
  - { option: 'SEMAPHORE_LDAP_SERVER',        var: "semaphore_ldap_server" }
  - { option: 'SEMAPHORE_LDAP_SEARCH_DN',     var: "semaphore_ldap_search_dn" }
  - { option: 'SEMAPHORE_LDAP_SEARCH_FILTER', var: "semaphore_ldap_search_filter" }
  - { option: 'SEMAPHORE_LDAP_MAPPING_DN',    var: "semaphore_ldap_mapping_dn" }
  - { option: 'SEMAPHORE_LDAP_MAPPING_MAIL',  var: "semaphore_ldap_mapping_mail" }
  - { option: 'SEMAPHORE_LDAP_MAPPING_UID',   var: "semaphore_ldap_mapping_uid" }
  - { option: 'SEMAPHORE_LDAP_MAPPING_CN',    var: "semaphore_ldap_mapping_cn" }

  ## Logging
  - { option: 'SEMAPHORE_LOG_LEVEL',    var: "semaphore_log_level" }
  - { option: 'SEMAPHORE_DEBUG_FILTER', var: "semaphore_debug_filter" }
  # ...

  ## Debugging
  # ...

  ## High Availability (HA)
  # ...


# Indicates if an API token is available in vars
semaphore_has_api_token: "{{ semaphore_api_token | default('', true) | length > 0 }}"

# Actual token used in API calls (from var or generated through authentication if empty)
semaphore_token: "{{ semaphore_api_token | default('', true) }}"
